schema_version: "1.1"
name: go-no-go-boca
description: Trip question gets an explicit NO-GO grounded in the active advisory, without inventing a boat
tags: [trip]
execution:
  max_turns: 14
  allowed_tools: [Skill]
  prompt: "Thinking about running out Boca Inlet first thing tomorrow to fish offshore. Should I go?"
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gillby-go-no-go"'
  - name: no-invented-boat
    type: tool_used
    tool: mcp__plugin_gillby_gillby__get_conditions
    input_match: '"boat"'
    min: 0
    max: 0
  - name: verdict
    type: llm
    criteria: |
      PASS if the reply gives a clear no-go (or equivalent "don't go") for tomorrow morning, cites the Small Craft Advisory with its timing, seas and wind, flags the inlet as the risky leg, and points to a later window if one was returned.
      FAIL if it recommends going, hedges without a call, invents a boat model or departure time, or omits the advisory.
